name: CI

# The same gates AGENTS.md asks for before a push, enforced here so they hold even when
# someone forgets — including on a machine that isn't the one they were developed on.
on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      # Don't hide a failure on one version because the other failed first.
      fail-fast: false
      matrix:
        # Both floors `engines` declares, plus a current release. The floor comes from Vite 7
        # (^20.19 || >=22.12), not from Next — it needs `require(esm)`, which lands in exactly
        # those two versions. Testing the floors is the point: an earlier matrix asserted 20.9
        # and the suite turned out not to run there at all.
        node: ["20.19", "22.12", "24"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # Run as separate steps rather than `npm run verify`, so the failing gate is the one
      # highlighted in the run summary instead of a single opaque red cross.
      - name: Lint
        run: npm run lint

      - name: README is still true
        run: npm run check:readme

      # A screenshot makes claims no other gate can read. This one cannot read them either — it
      # notices that a figure printed on an image has moved in the source since the image was
      # taken, which is how "519 tests" and "980 tests" both survived for days.
      - name: No screenshot has gone stale
        run: npm run check:screens

      # One Node version: the dependency tree is the same on all three, and asking the registry
      # three times for the same answer is three chances to fail for a reason unrelated to the
      # commit. The gate refuses to guess when the registry is unreachable rather than going red.
      - name: Every advisory is accounted for
        if: matrix.node == '24'
        run: npm run check:deps

      - name: Tests
        run: npm test

      # Not a fifth Node version's worth of signal: mutation testing breaks the engine on purpose
      # and asks whether the suite notices, which is the same answer on every runtime. Run on one
      # version only, and pinned to one seed so a red cross means this commit rather than this
      # draw. See `scripts/check-mutants.mjs` for how to go looking for new gaps on purpose.
      - name: Tests that test the tests
        if: matrix.node == '24'
        run: npm run check:mutants

      # Also the project's full type-check: `next build` compiles every route and both message
      # dictionaries, so a missing translation key fails here.
      - name: Build
        run: npm run build

      - name: The bundle is still within budget
        if: matrix.node == '24'
        run: npm run check:bundle

  # Its own job rather than a fifth step in the matrix: it needs a browser, and downloading one
  # three times to check the same HTML would triple the cost for no extra signal. One current Node
  # is enough — this gate is about the rendered page, not about the runtime.
  #
  # Split by width because this was the longest job in the run and therefore the only one the
  # whole run waited on: every other job finished while it was still scanning. The two halves take
  # about 70 seconds each against 140 for the pair, so the critical path halves, and the widths are
  # a real seam rather than an arbitrary cut — the bug this gate was built for was eight buttons
  # with no accessible name below 640px, invisible at desktop width. A red cross now names the
  # width before anyone opens the log. The shards' own script checks they still add up to the
  # whole gate, because a split gate that quietly scans less looks exactly like a passing one.
  accessibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        width: ["390", "1280"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: npm

      - name: Install
        run: npm ci

      # Keyed on the resolved Playwright version: a browser cached against an older one is the
      # wrong build, and Playwright refuses it rather than running it.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # System libraries aren't in the cached browser directory, so they're installed even on a hit.
      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The gate serves a production build, so one has to exist.
      - name: Build
        run: npm run build

      - name: axe on both pages at ${{ matrix.width }}px
        run: npm run check:a11y
        env:
          A11Y_WIDTH: ${{ matrix.width }}

  # Separate from the accessibility job even though both build the app and download a browser.
  # The cost is two parallel jobs instead of one; what it buys is a red cross that names which
  # kind of failure it was — a violation in the markup, or the app not working — without opening
  # the log. That distinction is worth more than the minutes.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build
        run: npm run build

      - name: Drive the app the way a person does
        run: npm run check:e2e

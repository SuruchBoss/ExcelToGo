# Static analysis for the code this repository actually ships.
#
# The other gates ask whether the app does what it should. This one asks whether it does something
# it should not — the classes of bug that are invisible in a passing test because the test never
# thought to send that input. It is here rather than folded into `ci.yml` because it runs on a
# schedule as well as on a push: an advisory that lands next month is new information about code
# that has not changed, and a gate that only runs on commits would never surface it.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, on a quiet morning UTC. The queries get updated more often than this project does.
    - cron: "17 6 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      # Writing the findings back to the Security tab is the whole point; without this the run
      # succeeds and tells nobody.
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # The extended suite rather than the default: this repository is small enough that the
          # extra findings are worth reading rather than drowning in.
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
